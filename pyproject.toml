[project]
name = "jts-ops"
version = "0.1.0"
description = "🧠 CLI that audits and applies the GitHub standard across all repositories"
authors = [
    { name = "Jonathan Tobias", email = "jonathantosilva@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fonttools>=4.68.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
jts-ops = "jts_ops.cli:console_main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/jts_ops/brand.py" = ["E501"]  # SVG templates

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false  # fontTools ships no stubs

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["jts_ops"]
